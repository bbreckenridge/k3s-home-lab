apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: keycloak-routing
  namespace: platform-services
spec:
  hosts:
  - auth.example.com
  gateways:
  - istio-system/default-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: keycloak.platform-services.svc.cluster.local
        port:
          number: 80
