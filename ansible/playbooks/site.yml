---
- name: Deploy K3s Cluster
  hosts: k3s_cluster
  become: true
  vars:
  vars:
    k3s_version: "v1.29.3+k3s1"
    
  tasks:
    - name: Install Dependencies
      apt:
        name: [curl, ca-certificates, nfs-common]
        state: present
        update_cache: yes

    - name: Download K3s Install Script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s_install.sh
        mode: '0700'

    - name: Install/Upgrade K3s (Single Node)
      shell: |
        INSTALL_K3S_VERSION="{{ k3s_version }}" sh /tmp/k3s_install.sh --write-kubeconfig-mode 644 --disable traefik

    - name: Wait for K3s to start
      wait_for:
        port: 6443
        delay: 5
        timeout: 60

    - name: Verify K3s Node Status
      command: k3s kubectl get nodes
      register: k3s_nodes
      changed_when: false

    - name: Show Node Status
      debug:
        msg: "{{ k3s_nodes.stdout_lines }}"
